<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Contact Chinmaya Vidyalaya, book a demo class, or leave a review."
    />
    <meta
      name="keywords"
      content="Chinmaya Vidyalaya, contact, book demo, leave review"
    />
    <link rel="stylesheet" href="form.css" />

    <title>Document</title>
  </head>
  <body>
    <section class="form-section">
      <h2>Contact / Book Demo / Leave Review</h2>
      <form
        action="https://formspree.io/f/your-form-code-here"
        method="POST"
        id="contactForm"
      >
        <label for="name">Your Name:</label>
        <input type="text" id="name" name="name" required />

        <label for="email">Your Email:</label>
        <input type="email" id="email" name="email" required />

        <label for="purpose">Purpose:</label>
        <select id="purpose" name="purpose" required>
          <option value="">Select...</option>
          <option value="query">Ask a Query</option>
          <option value="demo">Request Demo Class</option>
          <option value="review">Give Review / Feedback</option>
        </select>

        <label for="message">Your Message:</label>
        <textarea
          id="message"
          name="message"
          rows="6"
          placeholder="Tell us what subjects you're interested in, preferred time for demo, or your feedback..."
          required
        ></textarea>

        <button type="submit">Submit</button>
      </form>

      <div id="successMessage" class="hidden">
        Thank you! We'll get back to you soon via email.
      </div>
    </section>

    <script src="form.js"></script>
  </body>
</html>
